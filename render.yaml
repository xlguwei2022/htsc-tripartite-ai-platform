services:
  - type: web
    name: htsc-tripartite-ai-platform
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-public.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production-demo
      - key: DATABASE_URL
        fromDatabase:
          name: htsc-tripartite-db
          property: connectionString

databases:
  - name: htsc-tripartite-db
    plan: free
    region: singapore
