services:
  - type: web
    name: htsc-tripartite-ai-platform
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/xlguwei2022/htsc-tripartite-ai-platform
    branch: main
    buildCommand: pip install -r requirements-public.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: render-public-demo
      - key: DEMO_BASE_DATE
        value: "2026-08-10"
      - key: DATABASE_URL
        fromDatabase:
          name: htsc-tripartite-db
          property: connectionString

databases:
  - name: htsc-tripartite-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: tripartite_poc
    user: tripartite_demo
    ipAllowList: []
